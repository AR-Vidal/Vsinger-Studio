<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VsingerStudio - Virtual Singer Studio</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="VsingerStudio - Virtual Singer Studio" />
    <meta name="description" content="Create, train, manage, and publish virtual singer music with a local ACE-Step backend." />
    <meta name="keywords" content="virtual singer, AI music generator, ACE-Step, local AI, music generation, text to music" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="VsingerStudio" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#052659" />
    <meta name="application-name" content="VsingerStudio" />
    <meta name="apple-mobile-web-app-title" content="VsingerStudio" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              suno: {
                DEFAULT: '#09090b',
                sidebar: '#000000',
                panel: '#121214',
                card: '#18181b',
                hover: '#27272a',
                border: '#27272a',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'gradient-x': 'gradient-x 15s ease infinite',
            },
            keyframes: {
              'gradient-x': {
                '0%, 100%': {
                  'background-size': '200% 200%',
                  'background-position': 'left center'
                },
                '50%': {
                  'background-size': '200% 200%',
                  'background-position': 'right center'
                },
              },
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

      :root {
        --breakpoint-mobile: 768px;
        --vs-950: #021024;
        --vs-800: #052659;
        --vs-500: #5483B3;
        --vs-300: #7DA0CA;
        --vs-100: #C1EBFF;
        --vs-gradient-main: linear-gradient(135deg, var(--vs-950) 0%, var(--vs-800) 34%, var(--vs-500) 72%, var(--vs-300) 100%);
        --vs-gradient-soft: linear-gradient(135deg, rgba(2, 16, 36, 0.12) 0%, rgba(5, 38, 89, 0.18) 32%, rgba(84, 131, 179, 0.22) 68%, rgba(193, 235, 255, 0.34) 100%);
        --vs-accent-border: rgba(84, 131, 179, 0.45);
        --vs-accent-soft: rgba(193, 235, 255, 0.38);
        --vs-accent-soft-dark: rgba(84, 131, 179, 0.18);
      }

      ::selection {
        background: rgba(125, 160, 202, 0.35);
        color: #021024;
      }

      .dark ::selection {
        background: rgba(84, 131, 179, 0.35);
        color: #ffffff;
      }

      body {
        font-family: 'Inter', sans-serif;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d4d4d8;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a1a1aa;
      }

      /* Dark mode scrollbar */
      .dark ::-webkit-scrollbar-thumb {
        background: #3f3f46;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #52525b;
      }

      /* Hide scrollbar utility */
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }

      .gradient-text {
        background: linear-gradient(to right, var(--vs-950), var(--vs-800), var(--vs-500), var(--vs-300));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .vs-gradient-button,
      .vs-gradient-icon {
        background-image: var(--vs-gradient-main);
        color: #ffffff;
      }

      .vs-gradient-button {
        box-shadow: 0 18px 36px rgba(5, 38, 89, 0.18);
      }

      .vs-gradient-icon {
        box-shadow: 0 12px 24px rgba(5, 38, 89, 0.2);
      }

      .vs-accent-text {
        color: var(--vs-500);
      }

      .dark .vs-accent-text {
        color: var(--vs-300);
      }

      .vs-accent-text-strong {
        color: var(--vs-800);
      }

      .dark .vs-accent-text-strong {
        color: var(--vs-100);
      }

      .vs-accent-border {
        border-color: var(--vs-accent-border);
      }

      .vs-accent-soft {
        background-color: var(--vs-accent-soft);
        color: var(--vs-800);
      }

      .dark .vs-accent-soft {
        background-color: var(--vs-accent-soft-dark);
        color: var(--vs-100);
      }

      .vs-accent-surface {
        background-image: var(--vs-gradient-soft);
        border-color: rgba(84, 131, 179, 0.28);
      }

      .vs-accent-progress {
        background-image: linear-gradient(90deg, var(--vs-800) 0%, var(--vs-500) 60%, var(--vs-300) 100%);
      }

      .vs-accent-focus:focus,
      .vs-accent-focus:focus-visible {
        border-color: var(--vs-500) !important;
        box-shadow: 0 0 0 4px rgba(125, 160, 202, 0.16);
        outline: none;
      }

      [class*="bg-gradient-to-r"][class*="from-orange-500"][class*="to-pink-600"],
      [class*="bg-gradient-to-br"][class*="from-orange-500"][class*="to-pink-600"],
      [class*="bg-gradient-to-br"][class*="from-orange-400"][class*="to-pink-500"],
      [class*="bg-gradient-to-br"][class*="from-indigo-500"][class*="to-purple-600"],
      [class*="bg-gradient-to-r"][class*="from-pink-500"][class*="via-purple-500"][class*="to-blue-500"],
      [class*="bg-gradient-to-r"][class*="from-pink-500"][class*="to-purple-500"],
      [class*="bg-gradient-to-r"][class*="from-pink-500"][class*="to-purple-600"],
      [class*="bg-gradient-to-r"][class*="from-pink-500"][class*="to-purple-700"],
      [class*="bg-gradient-to-r"][class*="from-pink-500"][class*="to-blue-500"],
      [class*="bg-gradient-to-r"][class*="from-pink-500"][class*="to-purple-600"],
      [class*="bg-gradient-to-r"][class*="from-emerald-500"][class*="to-teal-600"] {
        background-image: var(--vs-gradient-main) !important;
      }

      [class*="bg-pink-600"],
      [class*="bg-pink-500"] {
        background-color: var(--vs-800) !important;
      }

      [class*="bg-pink-100"],
      [class*="bg-pink-50"],
      [class*="bg-orange-50"],
      [class*="bg-orange-100"] {
        background-color: rgba(193, 235, 255, 0.3) !important;
      }

      .dark [class*="bg-pink-500/10"],
      .dark [class*="bg-orange-500/10"],
      .dark [class*="bg-pink-600/10"],
      .dark [class*="bg-pink-600/20"],
      .dark [class*="bg-orange-500/15"] {
        background-color: rgba(84, 131, 179, 0.16) !important;
      }

      [class*="text-pink-500"],
      [class*="text-pink-600"],
      [class*="text-orange-600"],
      [class*="text-orange-300"] {
        color: var(--vs-500) !important;
      }

      .dark [class*="text-pink-500"],
      .dark [class*="text-pink-600"],
      .dark [class*="text-orange-600"],
      .dark [class*="text-orange-300"] {
        color: var(--vs-300) !important;
      }

      [class*="border-pink-500"],
      [class*="border-pink-600"],
      [class*="border-orange-400"],
      [class*="border-orange-300"],
      [class*="border-orange-200"] {
        border-color: var(--vs-accent-border) !important;
      }

      [class*="focus:border-pink-500"]:focus,
      [class*="focus:border-orange-400"]:focus {
        border-color: var(--vs-500) !important;
      }

      [class*="focus:ring-pink-500"]:focus,
      [class*="focus:ring-pink-500/20"]:focus,
      [class*="focus:ring-pink-500/40"]:focus {
        box-shadow: 0 0 0 4px rgba(125, 160, 202, 0.16) !important;
      }

      [class*="hover:bg-pink-700"]:hover,
      [class*="hover:bg-pink-600"]:hover {
        background-color: var(--vs-950) !important;
      }

      [class*="hover:text-pink-500"]:hover,
      [class*="hover:text-pink-600"]:hover {
        color: var(--vs-500) !important;
      }

      .dark [class*="hover:text-pink-500"]:hover,
      .dark [class*="hover:text-pink-600"]:hover {
        color: var(--vs-300) !important;
      }

      @keyframes music-bars {
        0% { height: 20%; opacity: 0.5; }
        50% { height: 100%; opacity: 1; }
        100% { height: 20%; opacity: 0.5; }
      }

      .music-bar-anim {
        animation: music-bars 1s ease-in-out infinite;
      }

      .mobile-only {
        display: none;
      }
      .desktop-only {
        display: block;
      }
      @media (max-width: 767px) {
        .mobile-only {
          display: block;
        }
        .desktop-only {
          display: none;
        }
        .mobile-only-flex {
          display: flex;
        }
        .mobile-only-inline {
          display: inline;
        }
        .mobile-only-inline-flex {
          display: inline-flex;
        }
      }

      @keyframes slide-in-left {
        from { transform: translateX(-100%); }
        to { transform: translateX(0); }
      }
      @keyframes slide-out-left {
        from { transform: translateX(0); }
        to { transform: translateX(-100%); }
      }
      @keyframes slide-in-right {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      @keyframes slide-out-right {
        from { transform: translateX(0); }
        to { transform: translateX(100%); }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes fade-out {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      .drawer-slide-in-left {
        animation: slide-in-left 0.3s ease-out forwards;
      }
      .drawer-slide-out-left {
        animation: slide-out-left 0.3s ease-in forwards;
      }
      .drawer-slide-in-right {
        animation: slide-in-right 0.3s ease-out forwards;
      }
      .drawer-slide-out-right {
        animation: slide-out-right 0.3s ease-in forwards;
      }
      .drawer-backdrop-in {
        animation: fade-in 0.3s ease-out forwards;
      }
      .drawer-backdrop-out {
        animation: fade-out 0.3s ease-in forwards;
      }

      .backdrop-blur-mobile {
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .backdrop-blur-mobile-lg {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      .safe-area-inset-top {
        padding-top: env(safe-area-inset-top, 0px);
      }
      .safe-area-inset-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .safe-area-inset-left {
        padding-left: env(safe-area-inset-left, 0px);
      }
      .safe-area-inset-right {
        padding-right: env(safe-area-inset-right, 0px);
      }
      .safe-area-inset-x {
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
      .safe-area-inset-y {
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .safe-area-inset-all {
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }

      .touch-none {
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      .touch-pan-x {
        touch-action: pan-x;
      }
      .touch-pan-y {
        touch-action: pan-y;
      }
      .touch-manipulation {
        touch-action: manipulation;
      }
      .tap-highlight-none {
        -webkit-tap-highlight-color: transparent;
      }
      .scroll-touch {
        -webkit-overflow-scrolling: touch;
      }
      .overscroll-none {
        overscroll-behavior: none;
      }
      .overscroll-contain {
        overscroll-behavior: contain;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body class="bg-suno text-zinc-900 dark:text-white overflow-hidden transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
